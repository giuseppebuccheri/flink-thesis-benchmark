global:
  scrape_interval: 1s
  evaluation_interval: 1s

scrape_configs:
  - job_name: 'flink-jobmanager'
    scrape_interval: 5s
    static_configs:
      - targets: ['flink-jobmanager:9249']

  - job_name: 'flink-taskmanager'
    scrape_interval: 5s
    static_configs:
      - targets: ['flink-taskmanager:9249']